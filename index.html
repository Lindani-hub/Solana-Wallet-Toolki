
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple Solana Devnet balance checker for learning Web3.">
  <title>Solana Wallet Toolkit</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #f4f4f5;
      background: #101018;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 28px;
      border: 1px solid #343442;
      border-radius: 20px;
      background: #1b1b27;
    }

    .tag { color: #b9a2ff; font-size: 13px; }

    h1 { margin-bottom: 8px; }

    p { color: #b9b9c9; line-height: 1.6; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      font: inherit;
    }

    input {
      color: white;
      background: #11111a;
      border: 1px solid #48485a;
    }

    button {
      border: 0;
      background: #8b70ff;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #result {
      margin-top: 22px;
      overflow-wrap: anywhere;
    }

    .balance {
      font-size: 28px;
      font-weight: 700;
      color: #b9a2ff;
    }

    a { color: #b9a2ff; }
    footer { margin-top: 24px; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <span class="tag">WEB3 LEARNING PROJECT</span>
    <h1>Solana Wallet Toolkit</h1>
    <p>
      Check a public wallet address on Solana Devnet.
      This tool never asks for your private key.
    </p>

    <form id="balanceForm">
      <label for="address">Solana wallet address</label>
      <input
        id="address"
        type="text"
        placeholder="Paste a public wallet address"
        autocomplete="off"
        required
      >
      <button id="checkButton" type="submit">
        Check Devnet Balance
      </button>
    </form>

    <div id="result" role="status" aria-live="polite"></div>

    <footer>
      Network: Solana Devnet · Educational use only
    </footer>
  </main>

  <script>
    const form = document.getElementById("balanceForm");
    const addressInput = document.getElementById("address");
    const button = document.getElementById("checkButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const address = addressInput.value.trim();
      result.textContent = "";

      // Basic Base58 character and length check.
      if (!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(address)) {
        result.textContent = "Please enter a valid-looking Solana address.";
        return;
      }

      button.disabled = true;
      button.textContent = "Checking...";
      result.textContent = "Connecting to Solana Devnet...";

      try {
        const response = await fetch(
          "https://api.devnet.solana.com",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0",
              id: 1,
              method: "getBalance",
              params: [address, { commitment: "confirmed" }]
            })
          }
        );

        if (!response.ok) {
          throw new Error("RPC request failed. Try again later.");
        }

        const data = await response.json();

        if (data.error || !data.result) {
          throw new Error("Could not retrieve this address balance.");
        }

        const sol = data.result.value / 1_000_000_000;

        result.replaceChildren();

        const heading = document.createElement("p");
        heading.textContent = "Devnet balance";

        const amount = document.createElement("div");
        amount.className = "balance";
        amount.textContent = sol.toLocaleString(
          "en-US",
          { maximumFractionDigits: 9 }
        ) + " SOL";

        const link = document.createElement("a");
        link.href = "https://explorer.solana.com/address/"
          + encodeURIComponent(address) + "?cluster=devnet";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "View address on Solana Explorer";

        result.append(heading, amount, link);
      } catch (error) {
        result.textContent = error.message
          || "Something went wrong. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Check Devnet Balance";
      }
    });
  </script>
</body>
</html>
